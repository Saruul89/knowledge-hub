c:'Анзаарах, сонсох, холбон зуучлах',face:'surprise',lead:'Сургуулийн орчин дахь анхны дэмжлэг',text:'Хүүхдийн аюулгүй байдал, хүндэтгэлтэй харилцаа, холбон зуучлах дараалалд төвлөрсөн материал.'},{id:'volunteer',name:'Сайн дурын тусламж үзүүлэгч',short:'Сайн дурын тусламж үзүүлэгч',desc:'Аюулгүй, хүндэтгэлтэй туслах',face:'disgust',lead:'Туслахад суралцъя',text:'Өөрийн үүргийн хүрээнд бодит дэмжлэг үзүүлж, шаардлагатай тусламжтай холбох.'},{id:'professional',name:'Сэтгэцийн эрүүл мэндийн мэргэжилтэн',short:'Мэргэжилтэн',desc:'Арга зүй, эх сурвалж, үйлчилгээ',face:'fear',lead:'Мэргэжлийн мэдлэг, хамтын ажиллагаа',text:'Арга зүй, үнэлгээний хэрэгслийн хяналт, мэргэжлийн дэмжлэг болон үйлчилгээний бүртгэл.'}];
let role='child',age='13–17',page='home',topicFilter='all',selectedTopic='stress',quizDone=false;const main=document.querySelector('main'),dialog=document.querySelector('dialog'),modal=document.querySelector('#modal-content');const current=()=>roles.find(r=>r.id===role);const btn=(text,p,cls='primary')=>`<button class="${cls}" data-page="${p}">${text}</button>`;const source=`<div class="source">Агуулгын суурь: «Хүүхдэд сэтгэлзүйн анхны дэмжлэг үзүүлэх гарын авлага», 2026, 2–6 дугаар бүлэг. Вебэд зориулан товчилсон жишээ; нийтлэхийн өмнө мэргэжлийн редакц хянана. <a href="https://www.who.int/news-room/fact-sheets/detail/adolescent-mental-health" target="_blank" rel="noopener">ДЭМБ: Өсвөр үеийнхний сэтгэцийн эрүүл мэнд</a></div>`;
const topics=[['stress','Өдөр тутмын стресс','Сургууль, гэр бүл, өөрчлөлттэй холбоотой ачааллаа ойлгох.','well','Өнөөдөр надад юу хэцүү байна вэ?'],['worry','Санаа зовнил, сэтгэл түгшил','Санаа зовж буй зүйлээ ойлгож, тусламж авах боломжтой танилцах.','well','Санаа зовж байгаагаа хэнтэй ярилцаж болох вэ?'],['mood','Гуниг, сонирхол буурах','Мэдрэмжийн өөрчлөлт болон өдөр тутмын амьдралд үзүүлэх нөлөөг анзаарах.','well','Миний мэдрэмж, өдөр тутмын амьдрал'],['sleep','Нойр ба амралт','Нойрны хэвшил болон амрах орчноо ажиглах.','daily','Нойр, амралтаа анзаарах'],['friends','Нөхөрлөл, дээрэлхэлт','Аюулгүй харилцаа, хил хязгаар, итгэдэг хүнээсээ тусламж хүсэх.','daily','Харилцаандаа аюулгүй байх'],['attention','Анхаарал, суралцах бэрхшээл','Суралцахад тулгардаг хэрэгцээг ойлгож, тохирсон дэмжлэг хайх.','development','Суралцахад надад юу туслах вэ?'],['development','Хөгжлийн ялгаатай хэрэгцээ','Аутизм, анхаарал дутмагших, хэт хөдөлгөөнтөх эмгэгийн талаарх мэдээллийн чиглэл.','development','Хэрэгцээнд тохируулсан дэмжлэг'],['loss','Алдагдал, хүнд үйл явдал','Хүнд нөхцөлд аюулгүй байдал, өдөр тутмын хэрэгцээ, дэмжлэгт анхаарах.','well','Хүнд үйл явдлын дараах дэмжлэг'],['habits','Цахим хэрэглээ, эрсдэлтэй зуршил','Хэрэглээ өдөр тутмын амьдралд хэрхэн нөлөөлж байгааг эргэцүүлэх.','daily','Өдөр тутмын хэвшлээ ажиглах']];
function strip(){return `<div class="role-strip"><span>Таны сонголт</span><label class="sr-only" for="role-select">Хэрэглэгчийн төрөл</label><select id="role-select">${roles.map(r=>`<option value="${r.id}" ${r.id===role?'selected':''}>${r.short}</option>`).join('')}</select>${role==='child'?`<label class="age">Насны түвшин <select id="age"><option ${age==='10–12'?'selected':''}>10–12</option><option ${age==='13–17'?'selected':''}>13–17</option><option ${age==='18+'?'selected':''}>18+</option></select></label>`:''}<span class="micro">Бүртгэлгүйгээр үзэх боломжтой</span></div>`}

function home(){return `<section class="hero"><div class="hero-inner"><div><span class="eyebrow">KNOWLEDGE HUB / МЭДЛЭГ • ОЙЛГОЛТ • ДЭМЖЛЭГ</span><h1>Сэтгэцийн эрүүл<br>мэндийн боловсролыг<br><em>хүн бүрт.</em></h1><p>Хаана амьдардгаас үл хамааран өөрийгөө ойлгох, бусдыг дэмжих, хэрэгтэй тусламжтайгаа холбогдох орон зай.</p><div class="actions"><button class="primary" id="choose-role">Өөрт тохирох хэсгээ сонгох <span>↓</span></button>${btn('Мэдээлэл үзэх →','topics','secondary')}</div><div class="micro"><span>Бүртгэл шаардахгүй</span><span>Гар утсанд тохирсон</span></div></div><div class="hero-art" role="img" aria-label="Цэнхэр дэвсгэр дээрх зургаан сэтгэл хөдлөлийн дүр бүхий үндсэн брэндинг"></div></div></section><section class="section" id="roles"><div class="section-head"><div><span class="eyebrow">ТАНД ТОХИРСОН АГУУЛГА</span><h2>Та аль хэсгээс эхлэх вэ?</h2><p>Сонголтоос хамаарч тайлбар, хичээл, мэдээллийн түвшин өөрчлөгдөнө.</p></div><span class="micro">Сонголтоо хүссэн үедээ сольж болно</span></div><div class="role-grid">${roles.map(r=>`<button class="role-card ${role===r.id?'selected':''}" data-role="${r.id}"><span class="arrow">↗</span><span class="face ${r.face}" aria-hidden="true"></span><strong>${r.name}</strong><small>${r.desc}</small></button>`).join('')}</div></section><section class="wash"><div class="section"><div class="section-head"><div><span class="eyebrow">НЭГ ОРОН ЗАЙ · ДӨРВӨН БОЛОМЖ</span><h2>Танд одоо юу хэрэгтэй байна?</h2></div></div><div class="route-grid">${[['01','Суралцах','Богино хичээл, бодит амьдралын жишээ, хэрэгжүүлэх алхам.','learn'],['02','Сорил, үнэлгээ','Мэдлэгээ шалгах эсвэл сонирхож буй сэдвээ тодорхойлох.','check'],['03','Зөвлөгөө, мэдээлэл','Өөрт хамаатай сэдвийг сонгож, ойлгомжтой тайлбар унших.','topics'],['04','Тусламж олох','Байршил, үйлчилгээний төрлөөр тусламж хайх.','help']].map(a=>`<button class="route-card" data-page="${a[3]}"><span class="num">${a[0]}</span><h3>${a[1]}</h3><p>${a[2]}</p><b>Үзэх →</b></button>`).join('')}</div></div></section><section class="section reach"><div><span class="eyebrow">АЛСЛАГДСАН Ч МЭДЛЭГТ ОЙР</span><h2>Хотод ч, суманд ч.<br>Танд ойлгомжтой.</h2><p>Хүүхэд бүр хэрэгтэй мэдээллээ өөрийн хурдаар үзэж, тусламж авах замаа мэддэг байх нь бидний зорилго.</p>${btn('Төслийн төлөвлөгөө →','plan','secondary')}</div><div class="reach-list"><div><b>01 / Уншихад хялбар, насанд тохирсон</b><p>10–12, 13–17 насны ялгаатай тайлбар; насанд хүрэгчдэд зориулсан дэлгэрэнгүй материал.</p></div><div><b>02 / Сул интернэттэй орчинд</b><p>Текстэд суурилсан хичээл, хөнгөн горим. Үндсэн үйлчилгээнд офлайн багцыг хөгжүүлэхээр төлөвлөнө.</p></div><div><b>03 / Үнэлгээ бөглөх албагүй</b><p>Мэдээлэл, тусламжийн хэсэгт шууд хандах боломжтой.</p></div></div></section>`}

const lessonBodies={feel:['Мэдрэмжээ нэрлэж сурах','Нэг мөч зогсоод өөрөөсөө “Би одоо юу мэдэрч байна?” гэж асуугаарай.','Баяр, гуниг, уур, айдас, гайхах, дургүйцэх зэрэг мэдрэмж зэрэгцэн төрж болно. Заавал ганц зөв хариу олох албагүй.','Хүсвэл мэдрэмжээ нэг үгээр хэлж, бичиж эсвэл зурж болно. Хуваалцах эсэхээ өөрөө сонгоно.'],talk:['Итгэдэг хүнтэйгээ ярилцах','Чамайг сонсож, аюулгүй байхад тусалдаг хүнээ бодоорой. Энэ нь асран хамгаалагч, багш, сургуулийн нийгмийн ажилтан эсвэл өөр итгэдэг насанд хүрсэн хүн байж болно.','“Надад яримаар зүйл байна. Та намайг хэсэг сонсож болох уу?” гэж эхэлж болно.','Хэрэв эхний хүн сонсохгүй, эсвэл өөрөө аюулын шалтгаан бол өөр аюулгүй насанд хүрсэн хүн, мэргэжилтэнд хандаарай.'],friend:['Найзыгаа дэмжих','Ярихыг хүсвэл таслалгүй сонсоорой. Ярихыг шаардах, бусдад яриаг нь тараах хэрэггүй.','Чи найзынхаа бүх асуудлыг ганцаараа шийдэх үүрэггүй. “Хэнээс хамтдаа тусламж хүсэх вэ?” гэж асууж болно.','Аюулгүй байдалд нь шууд эрсдэл байвал нууцална гэж амлахгүй, аюулгүй насанд хүрсэн хүний тусламжийг шуурхай аваарай.'],develop:['Хөгжлийн онцлогт тохирсон дэмжлэг','Хүүхдийн наснаас гадна ойлгох, харилцах, суралцах хэрэгцээг нь харгалзана.','Зааврыг богино, тодорхой өгч, хариулах хугацаа олгоно. Шаардлагатай бол зураг, дүрслэл ашиглана.','Бусадтай харьцуулахын оронд давуу тал, тухайн хүүхдэд хэрэгтэй дэмжлэгийг асран хамгаалагч болон холбогдох мэргэжилтэнтэй хамт тодорхойлно.'],listen:['Сонсохоос эхлэх','Тайван, боломжтой бол хувийн орчинд ярилцаж, ярих эсэхийг хүүхдээр өөрөөр нь шийдүүлнэ.','Яриаг таслах, буруутгах, хүсээгүй дэлгэрэнгүй мэдээллийг шаардахаас зайлсхийнэ.','“Одоо чамд юу хэрэгтэй байна?” гэж асууж, ойлгосноо богино үгээр эргэн хэлж болно.'],pfa:['Анзаарах · Сонсох · Холбох','Анзаарах: орчны аюулгүй байдал, хүүхдийн нэн тэргүүний хэрэгцээ, шуурхай тусламж шаардлагатай эсэхийг анхаарна.','Сонсох: өөрийгөө танилцуулж, туслахыг санал болгоно. Хүчээр яриулахгүй, шүүмжлэхгүй.','Холбох: хэрэгцээнд тохирсон бодит дэмжлэг, аюулгүй ойр дотнын хүн, шаардлагатай үйлчилгээтэй холбоно. Анхны дэмжлэг нь оношилгоо, сэтгэл засал эмчилгээг орлохгүй.'],boundary:['Үүрэг, хил хязгаар','Өөрийн үүрэг, боломжийг үнэн зөв тайлбарлана. Биелүүлж чадахгүй амлалт өгөхгүй.','Өөрийн бэлтгэл, мэргэжлийн эрхээс давсан оношилгоо, эмчилгээ хийхгүй.','Хүүхдийн аюулгүй байдал болон шаардлагатай үйлчилгээнд хүрэхэд анхаарна.'],self:['Өөрийгөө анзаарах','Ажлын ачаалал, биеийн ядаргаа, сэтгэл хөдлөл, амралтын хэрэгцээгээ анзаарна.','Завсарлага, хамтрагчийн дэмжлэг, удирдагчтай зөвлөлдөх боломжийг ашиглана.','Хүндрэлээ ганцаараа зохицуулах гэж хичээхгүй; шаардлагатай үед мэргэжлийн дэмжлэг авна.'],link:['Холбон зуучлах','Хэрэгцээ, аюулгүй байдал, үйлчилгээний тохироо болон хүртээмжийг харгалзана.','Холбоо барих мэдээлэл, үйлчилгээний нөхцөлийг нягталж, мэдээлэл дамжуулах зөвшөөрөл болон нууцлалын хүрээг тайлбарлана.','Хүүхэд, асран хамгаалагчтай тохирсон дараагийн алхам, эргэн холбооны боломжийг тодорхойлно.'],tools:['Үнэлгээний хэрэгслийг сонгох','Хэрэглэгдэх нас, бөглөгч, зорилго, хэлний хувилбар болон баталгаажуулалтын баримтыг шалгана.','Ашиглах эрх, оноолт, тайлбарлах заавар, эрсдэл илэрвэл авах арга хэмжээг урьдчилан тогтооно.','Энэ загварт оношлох сорил оруулаагүй. Мэргэжлийн хяналтаар баталсны дараа тусдаа модуль болгоно.'],supervision:['Мэргэжлийн супервиз','Хүүхдийн аюулгүй байдал, шаардлагатай мэргэжлийн тусламж, үйлчилгээний чанарыг хэлэлцэнэ.','Ажилтны ачаалал, дэмжлэгийн хэрэгцээ, үүргийн хязгаарыг анхаарна.','Хувийн мэдээллийг хамгаалж, зөвхөн шаардлагатай хүрээнд тохиолдлыг хэлэлцэнэ.']};

function topicPage(){return `<section class="section">${title('ЗӨВЛӨГӨӨ, МЭДЭЭЛЭЛ','Сонирхож буй сэдвээ олоорой.','Үнэлгээ бөглөхгүйгээр мэдээлэл үзэж болно. Сэдэв сонгох нь танд онош тавьж байгаа гэсэн үг биш.')}<label class="sr-only" for="search">Сэдэв хайх</label><input class="search" id="search" type="search" placeholder="Жишээ нь: нойр, нөхөрлөл, анхаарал…"><div class="chips">${[['all','Бүх сэдэв'],['well','Мэдрэмж, сэтгэлзүй'],['daily','Өдөр тутмын амьдрал'],['development','Хөгжил, суралцахуй']].map(a=>`<button class="chip ${topicFilter===a[0]?'active':''}" data-filter="${a[0]}">${a[1]}</button>`).join('')}</div><div class="card-grid" id="topic-results"></div>${source}</section>`}

function topic(id){selectedTopic=id;let t=topics.find(x=>x[0]===id);let child=role==='child';let specific={stress:'Хэцүү санагдаж буй нэг зүйлээ сонгоод, одоо өөрийн хийж болох жижиг алхмыг бодоорой.',worry:'Юунд санаа зовж байгаагаа хүсвэл үгээр илэрхийлж, итгэдэг хүнтэйгээ ярилцаж болно.',mood:'Мэдрэмж болон өдөр тутмын хийх дуртай зүйл, суралцах, харилцах байдалд гарсан өөрчлөлтийг анзаараарай.',sleep:'Унтах, сэрэх цаг болон амрах орчиндоо юу ажиглаж байгаагаа бодоорой.',friends:'Тавгүй, айдастай эсвэл дарамттай санагддаг харилцааны талаар аюулгүй насанд хүрсэн хүнтэй ярилцаарай.',attention:'Ямар даалгавар хэцүү, ямар тайлбар эсвэл орчин тус болж байгааг багш, асран хамгаалагчтайгаа ярилцаарай.',development:'Хүн бүрийн харилцах, суралцах, мэдрэх хэрэгцээ өөр. Тухайн хүнд юу тус болж байгааг асууж, тохируулсан дэмжлэг үзүүлнэ.',loss:'Аюулгүй орчин, өдөр тутмын хэрэгцээ, ойр дотнын аюулгүй хүний дэмжлэгийг эхэлж анхаарна. Ярихыг шаардахгүй.',habits:'Цахим болон бусад хэрэглээ унтах, хичээллэх, харилцах цагт хэрхэн нөлөөлж байгааг анзаараарай.'}[id];show(`<span class="eyebrow">${current().short} / ${child?age+' нас':'МЭДЭЭЛЭЛ'}</span><h2>${child?t[4]:t[1]}</h2><p>${t[2]}</p><h3>${child&&age==='10–12'?'Нэг жижиг алхам':'Юунаас эхлэх вэ?'}</h3><p>${specific}</p>${!child?'<p>Хүүхдийн нас, хөгжлийн онцлог, орчин болон өөрийнх нь тайлбарыг хамтад нь харгалзана. Нэг шинж эсвэл энэ мэдээллээр онош тогтоохгүй.</p>':''}<h3>Дэмжлэг хэрэгтэй бол</h3><p>Өдөр тутмын амьдралд хүндрэл учруулж байгаа эсвэл танд санаа зовоож байвал итгэдэг хүн, холбогдох мэргэжилтэнтэй ярилцаж болно. Үнэлгээний оноо хүлээх шаардлагагүй.</p><div class="actions"><button class="primary" data-page="help">Тусламж олох →</button><button class="secondary" data-page="check">Хэрэгцээгээ сонгох</button></div>${source}`)}
function check(){return `<section class="section">${title('СОРИЛ, ҮНЭЛГЭЭ','Өөрт хэрэгтэй чиглэлээ сонгоё.','Энэ хэсэг сонголттой. Хичээл, мэдээлэл, тусламж авахын өмнө заавал бөглөх шаардлагагүй.')}<div class="split"><article class="panel"><span class="eyebrow">01 / ХЭРЭГЦЭЭГЭЭ ТОДОРХОЙЛОХ</span><h2>Юуны талаар мэдмээр байна?</h2><p>Сэдэв болон хэрэгцээгээ сонгоод тохирох материалын санал аваарай. Оноо өгөхгүй, онош тогтоохгүй.</p><label for="need-topic">Сонирхож буй сэдэв</label><select id="need-topic">${topics.map(t=>`<option value="${t[0]}" ${t[0]===selectedTopic?'selected':''}>${t[1]}</option>`).join('')}</select><label for="need-kind">Одоогийн хэрэгцээ</label><select id="need-kind"><option value="learn">Илүү сайн ойлгомоор байна</option><option value="support">Өөрийгөө / бусдыг дэмжих арга хайж байна</option><option value="help">Мэргэжлийн тусламж хаанаас авахыг мэдмээр байна</option></select><button class="primary" id="recommend">Тохирох мэдээлэл харах →</button></article><article class="panel"><span class="eyebrow">02 / МЭДЛЭГЭЭ ШАЛГАХ</span><h2>Анхны дэмжлэгийн тухай</h2><p>Богино сургалтын дараах 3 асуулт. Хариулт бүрийн тайлбартай.</p><p>Энэ нь сэтгэцийн эрүүл мэндийн илрүүлгийн асуумж биш.</p><button class="primary" id="start-quiz">Сорил эхлүүлэх →</button></article></div><div id="recommend-result" aria-live="polite"></div><div class="plan-block" style="margin-top:35px"><span class="eyebrow">ДАРААГИЙН ШАТНЫ БОЛОМЖ</span><h2>Илрүүлгийн үнэлгээний модуль</h2><p>Сэтгэл түгшил, сэтгэл гутрал, анхаарал ба зан үйл, нойр болон бусад хэрэгцээнд тохирох хэрэгслийг мэргэжлийн баг сонгоно.</p><div class="notice">Баталсан асуумжийн жагсаалт одоогоор байхгүй. Нас, монгол хувилбарын баталгаажуулалт, ашиглах эрх, үр дүнгийн тайлбар болон тусламжид чиглүүлэх дүрмийг нягталсны дараа идэвхжүүлнэ.</div></div></section>`}

const demoProviders=[{region:'Улаанбаатар',type:'psych',remote:true,title:'Сэтгэл зүйн зөвлөгөөний үйлчилгээ',info:'Хүүхэд, өсвөр үеийнхэн · Танхим / зайнаас'}, {region:'Хөвсгөл',type:'medical',remote:false,title:'Аймгийн түвшний мэргэжлийн тусламж',info:'Сэтгэцийн эмчийн тусламж · Танхим'}, {region:'Өмнөговь',type:'social',remote:true,title:'Нийгмийн болон хүүхэд хамгааллын дэмжлэг',info:'Холбон зуучлах үйлчилгээ · Танхим / зайнаас'}];

function plan(){return `<section class="section">${title('ТӨСЛИЙН ТАНИЛЦУУЛГА / ЭХНИЙ ХУВИЛБАР','Knowledge hub','Сэтгэцийн эрүүл мэндийн боловсролыг хүн бүрт — хүүхэд, гэр бүл, тусламж үзүүлэгчдийн хэрэгцээнд тохирсон нэгдсэн мэдээллийн орон зай.')}<div class="actions no-print">${btn('Хэрэглэгчийн загварыг үзэх →','home')}<button class="secondary" id="print-plan">Төлөвлөгөө хэвлэх / PDF</button></div><div class="plan-block" style="margin-top:30px"><h3>01 / Зорилго ба зорилтот бүлэг</h3><p>Алслагдсан сумын хүүхдийг оролцуулан сэтгэцийн эрүүл мэндийн ойлгомжтой боловсролд тэгш хүргэх; шаардлагатай үед тохирох тусламжид хүрэх замыг тодорхой болгох.</p><p>Эхний санал: хүүхдийн боловсролын агуулгыг 10 наснаас эхлүүлж, 10–12 болон 13–17 насанд тохируулна. 18-аас дээш насны хэрэглэгчид мөн нээлттэй. Энэ нь бүх үнэлгээг 10 наснаас хэрэглэх зөвшөөрөл биш.</p></div><div class="plan-block"><h3>02 / Хэрэглэгчийн үндсэн урсгал</h3><div class="flow"><span>Хэрэглэгчийн төрлөө сонгох</span><span>→ Хэрэгцээгээ сонгох</span><span>→ Хичээл / мэдээлэл үзэх</span><span>→ Хүсвэл сорил, үнэлгээ</span><span>→ Тохирох мэдээлэл, тусламж</span></div><p>Бүртгэл болон үнэлгээ нь мэдээлэл авахын өмнөх заавал дамжих алхам биш. Тусламжийн хэсэгт аль ч хуудсаас шууд хүрнэ.</p><div class="table-wrap"><table><thead><tr><th>Хэрэглэгч</th><th>Тохируулсан агуулга</th><th>Тусгай боломж</th></tr></thead><tbody>${roles.map((r,i)=>`<tr><td>${r.name}</td><td>${r.desc}</td><td>${['Насны түвшин, итгэдэг хүнээс тусламж хүсэх','Хүүхэдтэй харилцах жишээ','Ажлын дараалал, сургуулийн дэмжлэг','Үүргийн хүрээ, анхны дэмжлэг','Арга зүй, хяналт, үйлчилгээний бүртгэл'][i]}</td></tr>`).join('')}</tbody></table></div></div><div class="plan-block"><h3>03 / Вебийн бүтэц</h3><div class="step-list"><article><b>СУРГАЛТ</b><p>Гарын авлагын агуулга → хэрэглэгч, насанд тохируулсан богино хичээл → мэдлэг шалгах сорил.</p></article><article><b>МЭДЭЭЛЭЛ БА ҮНЭЛГЭЭ</b><p>Сэдвээр хайх; хэрэгцээнд тохирсон санал. Баталгаажуулсан илрүүлгийн хэрэгслийг дараагийн шатанд сонгоно.</p></article><article><b>ХОЛБОН ЗУУЧЛАХ</b><p>Байршил, үйлчилгээ, зайнаас тусламж; мэргэжилтний баталгаажсан танилцуулга.</p></article></div></div><div class="plan-block"><h3>04 / Агуулгын эх ба хяналт</h3><div class="table-wrap"><table><thead><tr><th>Номын агуулга</th><th>Вебэд ашиглах хэлбэр</th></tr></thead><tbody><tr><td>Анхны дэмжлэгийн ойлголт</td><td>Суурь богино хичээл</td></tr><tr><td>Нас, хэвийн хөгжил</td><td>Насанд тохирсон тайлбар; эцэг эх, багшийн материал</td></tr><tr><td>Харилцах зарчим</td><td>Харилцан ярианы жишээ, хийж болох / болохгүй үйлдэл</td></tr><tr><td>Зонхилох асуудал, үнэлгээ</td><td>Сэдвийн сан; мэргэжлийн хяналттай үнэлгээний модуль</td></tr><tr><td>Хариу арга хэмжээ</td><td>Алхамчилсан дэмжлэг, холбон зуучлах</td></tr><tr><td>Тусламж үзүүлэгчид үзүүлэх дэмжлэг</td><td>Өөрийгөө халамжлах, супервиз, ажлын ачаалал</td></tr></tbody></table></div><p>Материал бүрд эх сурвалж, хянасан мэргэжилтэн, зорилтот нас, шинэчилсэн огноо, дараагийн хяналтын хугацааг бүртгэнэ. Номын эхийг шууд хуулж хүүхдэд үзүүлэхгүй.</p></div><div class="plan-block"><h3>05 / Хөгжүүлэлтийн үе шат</h3><div class="step-list"><article><b>ОДОО · ҮЗҮҮЛЭН</b><h3>Бүтэц ба хэрэглээ</h3><p>5 хэрэглэгч, богино хичээл, сэдвийн хайлт, мэдлэгийн сорил, хэрэгцээнд суурилсан санал, үйлчилгээний жишээ хайлт.</p></article><article><b>ДАРААГИЙН ШАТ · ТУРШИЛТ</b><h3>Хяналт ба бодит сан</h3><p>Хүүхэд, эцэг эх, багштай хэрэглээний туршилт; мэргэжлийн редакц; үйлчилгээ үзүүлэгчийг баталгаажуулах; нууцлал ба хүүхэд хамгааллын зохицуулалт.</p></article><article><b>ӨРГӨЖҮҮЛЭЛТ</b><h3>Хүртээмж ба үнэлгээ</h3><p>Баталсан асуумж, офлайн багц, аудио, сумын түвшний хайлт, хэрэглэгчийн зөвшөөрөлтэй сургалтын ахиц.</p></article></div></div><div class="plan-block"><h3>06 / Хэрэгжүүлэхээс өмнө шийдэх зүйлс</h3><p>Агуулгыг хариуцах байгууллага, мэргэжлийн редакц; үйлчилгээний сангийн эзэн; хүүхэд хамгааллын хариу арга хэмжээ; мэдээлэл хадгалах бодлого; хөдөөгийн хэрэглэгчтэй турших төлөвлөгөө; санхүүжилт ба техникийн хариуцлага.</p><p>Үр дүнг зөвхөн хандалтаар хэмжихгүй: хүүхэд мэдээллээ ойлгож байгаа эсэх, тусламжийн замаа олж байгаа эсэх, сул интернэтэд ашиглаж чадаж байгаа эсэхийг туршина.</p></div>${source}</section>`}

function simpleModal(id){const m={urgent:`<span class="eyebrow">ОДОО ТУСЛАМЖ ХЭРЭГТЭЙ БОЛ</span><h2>Аюулгүй байдал хамгийн түрүүнд.</h2><p>Хэрэв та эсвэл өөр хүн шууд аюулд байгаа бол ойр байгаа аюулгүй насанд хүрсэн хүнээс тусламж хүсэж, орон нутгийн яаралтай тусламжийн байгууллагад нэн даруй хандаарай. Энэ веб дээр хариу хүлээх хэрэггүй.</p><p>Хүүхэд бол аюулгүй асран хамгаалагч, багш, нийгмийн ажилтан эсвэл өөр итгэдэг насанд хүрсэн хүнд хэлээрэй.</p><div class="notice">Энэ үзүүлэн нь шууд хяналт, чат, дуудлагын үйлчилгээ үзүүлэхгүй. Баталгаажсан тусламжийн холбоо барих мэдээллийг бодит хувилбарт нэмнэ.</div>${btn('Тусламж хайх хэсэг →','help')}`,privacy:`<h2>Нууцлалын тухай</h2><p>Энэ үзүүлэн бүртгэл үүсгэхгүй, үнэлгээний хариу болон хувийн мэдээллийг серверт илгээхгүй. Сонголтууд зөвхөн нээлттэй хуудасны санах ойд байна.</p><p>Бодит хувилбарт хүүхдийн мэдээлэл, зөвшөөрөл, хадгалалтын хугацаа, хэн хандах эрхтэй болон аюулгүй байдлын үед авах арга хэмжээг тусгайлан батална.</p><p>Хүүхдийн хариуг эцэг эх, багштай автоматаар хуваалцахгүй байхаар төлөвлөж байна.</p>`,contact:`<h2>Холбоо барих</h2><p>Төслийг хариуцах байгууллагын баталгаажсан и-мэйл, утас, ажлын цагийг энэ хэсэгт байршуулна.</p><p>Одоогоор холбоо барих бодит мэдээлэл нийлүүлээгүй тул хуурамч хаяг оруулаагүй.</p>${btn('Төслийн танилцуулга →','plan','secondary')}`,complete:`<h2>Хичээлээ уншиж дууслаа.</h2><p>Хүсвэл богино сорилоор мэдлэгээ шалгаж эсвэл бусад сэдэвтэй танилцаарай. Энэ үзүүлэнд сургалтын ахиц хадгалахгүй.</p><div class="actions">${btn('Мэдлэгээ шалгах','check')}${btn('Өөр хичээл үзэх','learn','secondary')}</div>`,register:`<span class="eyebrow">ҮЙЛЧИЛГЭЭ ҮЗҮҮЛЭГЧИЙН БҮРТГЭЛ / ЗАГВАР</span><h2>Хянаж баталгаажуулсны дараа нийтэлнэ.</h2><ol class="steps"><li>Нэр, мэргэжил, байгууллага, байршил</li><li>Мэргэжлийн боловсрол болон шаардлагатай эрхийн баримт</li><li>Хүүхэдтэй ажиллах хүрээ, үйлчилгээний төрөл, төлбөр</li><li>Зайнаас тусламж үзүүлэх боломж, холбоо барих мэдээлэл</li><li>Нийтлэх зөвшөөрөл, мэдээллээ шинэчлэх хариуцлага</li></ol><div class="notice">Бүртгэлийн бүтэц харуулж байгаа тул энэ үзүүлэнд хувийн мэдээлэл, баримт хүлээн авахгүй.</div>`};show(m[id]||'')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.classList.contains('close')){dialog.close();return}if(b.dataset.page){dialog.close();render(b.dataset.page);return}if(b.dataset.role){role=b.dataset.role;render('learn');return}if(b.dataset.lesson){lesson(b.dataset.lesson);return}if(b.dataset.topic){topic(b.dataset.topic);return}if(b.dataset.filter){topicFilter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter===topicFilter));filterTopics();return}if(b.dataset.modal){simpleModal(b.dataset.modal);return}if(b.dataset.provider!==undefined){let p=demoProviders[+b.dataset.provider];show(`<span class="eyebrow">ЖИШЭЭ ТАНИЛЦУУЛГА / БОДИТ ҮЙЛЧИЛГЭЭ БИШ</span><h2>${p.title}</h2><p>${p.region} · ${p.info}</p><table><tr><th>Мэргэжилтэн / байгууллага</th><td>Баталгаажсан мэдээллээр нөхнө</td></tr><tr><th>Төлбөр, ажлын цаг</th><td>Үйлчилгээ үзүүлэгчээс нягтална</td></tr><tr><th>Холбоо барих, хаяг</th><td>Зөвшөөрөлтэй нийтэлнэ</td></tr><tr><th>Сүүлд баталгаажуулсан</th><td>Огноо оруулна</td></tr></table><p class="micro">Энэ загвараар цаг захиалах, хүнтэй холбогдох боломжгүй.</p>`);return}if(b.id==='choose-role')document.querySelector('#roles').scrollIntoView({behavior:'smooth'});if(b.id==='print-plan')window.print();if(b.id==='lite'){document.body.classList.toggle('lite');b.textContent=document.body.classList.contains('lite')?'Зурагтай горим':'Хөнгөн горим'}if(b.id==='start-quiz')startQuiz();if(b.id==='recommend'){selectedTopic=document.querySelector('#need-topic').value;let t=topics.find(t=>t[0]===selectedTopic),k=document.querySelector('#need-kind').value;let el=document.querySelector('#recommend-result');el.innerHTML=`<div class="result"><span class="eyebrow">ТАНЫ СОНГОСОН ХЭРЭГЦЭЭНД ТОХИРСОН</span><h3>${t[1]}</h3><p>Энэ санал таны сонгосон сэдэв, хэрэгцээнд тулгуурласан. Эрсдэлийн үнэлгээ болон онош биш.</p><div class="actions">${k==='help'?btn('Тусламж хайх →','help'):`<button class="primary" data-topic="${t[0]}">Мэдээллээ унших →</button>`}${btn(k==='support'?'Дэмжлэгийн хичээл үзэх':'Холбогдох хичээл үзэх','learn','secondary')}</div></div>`;el.scrollIntoView({behavior:'smooth',block:'nearest'})}});
document.addEventListener('change',e=>{if(e.target.id==='role-select'){role=e.target.value;render(page)}if(e.target.id==='age'){age=e.target.value;render(page)}if(['region','service','remote'].includes(e.target.id))providers()});document.addEventListener('input',e=>{if(e.target.id==='search')filterTopics()});document.addEventListener('submit',e=>{if(e.target.id!=='quiz-form')return;e.preventDefault();let f=new FormData(e.target),score=0;let rows=quiz.map((q,i)=>{let correct=Number(f.get('q'+i))===q[2];if(correct)score++;return `<div class="question"><b>${i+1}. ${correct?'Зөв':'Дахин анхаарах зүйл'}</b><p>${q[0]}</p><p><strong>${q[1][q[2]]}</strong></p><p>${q[3]}</p></div>`}).join('');show(`<span class="eyebrow">МЭДЛЭГИЙН СОРИЛЫН ХАРИУ</span><h2>${score} / 3 зөв хариулт</h2><p>Энэ нь зөвхөн сургалтын мэдлэгийн сорилын үр дүн.</p>${rows}<div class="actions" style="margin-top:20px"><button class="primary" id="start-quiz">Дахин оролдох</button>${btn('Хичээл рүү буцах','learn','secondary')}</div>`)});dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});render(location.hash.slice(1)||'home');
</script></body></html>
